name: gameclub_hisoblagich
description: O'yin klublar uchun stansiya hisoblagichi va chek ilovasi
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Holatni butun ilova bo'ylab ulashish (StationStore)
  provider: ^6.1.2

  # Mahalliy baza (stansiyalar, cheklar, qarz daftari)
  sqflite: ^2.3.3
  sqflite_common_ffi: ^2.3.3
  sqlite3_flutter_libs: ^0.5.24
  path: ^1.9.0
  path_provider: ^2.1.4

  # Sana/vaqt formatlash
  intl: ^0.19.0

  # QR kod generatsiyasi (chek uchun)
  qr_flutter: ^4.1.0

  # Ilova yopiq/fonda bo'lsa ham signal (bildirishnoma) berish
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4

  # Chekni printerga chiqarish (PDF -> tizim print dialogi)
  printing: ^5.13.2
  pdf: ^3.11.1

  # Chekni ulashish (agar kerak bo'lsa)
  share_plus: ^10.0.2

  # Ruxsatlarni so'rash (bildirishnoma, aniq alarm)
  permission_handler: ^11.3.1

  # QR logotipi uchun rasm tanlash
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  windows: true
  image_path: "assets/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
